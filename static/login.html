<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="description" content="ArcTrade 관리자 연구소 로그인">
<title>관리자 로그인 · ArcTrade</title><link rel="stylesheet" href="/static/login.css?v=20261014-white">
</head>
<body>
<header><a href="/" class="brand">ArcTrade</a><a href="/">페이퍼 성과 보기</a></header>
<main>
<section class="access" aria-labelledby="login-title">
<h1 id="login-title">연구소 관리자 로그인</h1>
<p class="intro">페이퍼매매 성과는 로그인 없이 볼 수 있습니다.</p>
<form id="auth-form">
<label for="username">관리자 아이디</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_\-]+" required>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="200" required>
<button class="submit" id="submit" type="submit">연구소 로그인</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script src="/static/login.js?v=20261014-arctrade" defer></script>
</body></html>
